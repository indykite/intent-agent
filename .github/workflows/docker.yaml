---
name: Build Docker container and deploy to dev

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - uv.lock
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  id-token: write # required by https://github.com/google-github-actions/auth
  contents: read # required by checkout

jobs:
  build-docker:
    # Don't run for draft PRs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build Docker container
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      image-tag-sha: ${{ steps.image-tag-sha.outputs.image-tag }}
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Generate image version based on sha commit hash
        id: image-tag-sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image-tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ format('{0}/{1}/indykite/{2}', vars.ARTIFACT_REGISTRY_URL, secrets.GCP_PROJECT_ID_MGMT, github.event.repository.name) }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Setup Docker
        uses: indykite/ops-common/.github/actions/docker-setup@cd7081295c7d8144b29aa9ec2002df4cac269f5b # master
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          docker-repository-hostname: ${{ vars.ARTIFACT_REGISTRY_URL }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM
          provenance: mode=max
          sbom: true
