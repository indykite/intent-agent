---
# Golden eval suite (TDD 7.1 / 7.2): runs evals/ against the real Gemini model and fails on any
# launch-gate regression - correctness >= 85%, injection resistance 100%, no forced match on a
# refusal fixture. Runs for every PR that touches the service code (skill content, the
# input_schema derivation, the LLM version/provider config, the schema loader, the pipeline
# modules around them - a directory prefix, not a file list, so a refactor can't silently drop a
# module out of the check), the dependency pins, or the suite itself, and on demand.
# `golden-evals` is meant to be a required check: every PR reports it (no `paths:` filter on the
# PR trigger, which would leave it "Pending" forever on unrelated PRs), and the job is skipped -
# which counts as passing - when the PR changes none of those files.
# The Gemini key is never given to code from a fork: a fork PR skips the suite, which then runs on
# master once the change is merged (or earlier, if a maintainer copies the reviewed commit to a
# branch of this repository).
name: Golden eval suite

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # After merge: covers the changes that came from forks and were skipped on their PR.
  push:
    branches:
      - master
    paths:
      - indykite/**
      # release-please's version bump alone doesn't change what the suite measures
      - '!indykite/intent_agent/version.py'
      - pyproject.toml
      - uv.lock
      - evals/**
      - .github/workflows/eval-suite.yaml
  workflow_dispatch: {}

concurrency:
  # A newer push to the same PR replaces its run. Runs on master and manual runs each get their own
  # group: a shared one would cancel a pending run when the next merge is queued, leaving that merge
  # unevaluated.
  group: eval-suite-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # required by checkout
  pull-requests: write # required by mshick/add-pr-comment

jobs:
  changes:
    # Same-repository, non-draft PRs only: decides whether the PR touches anything the suite covers.
    # No checkout and no secrets; the file list comes from the GitHub API.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: read # required to list the PR's files
    timeout-minutes: 5
    runs-on: ubuntu-slim
    outputs:
      relevant: ${{ steps.files.outputs.relevant }}
    steps:
      - name: List the files the PR changes
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # the service code: skill content, the input_schema derivation, the post-processing that
          # decides the response, the LLM/provider config, the schema and policy loaders; the
          # provider SDK pin and the model default's dependencies; the suite itself
          pattern='^(indykite/|evals/)|^(pyproject\.toml|uv\.lock|\.github/workflows/eval-suite\.yaml)$'
          # a renamed file counts by its old path too, so moving a module out of indykite/ still runs the suite
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # release-please's version bump alone doesn't change what the suite measures
          files=$(grep -vxF 'indykite/intent_agent/version.py' <<<"${files}" || true)
          if grep -qE "${pattern}" <<<"${files}"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  golden-evals:
    needs: [changes]
    # PRs: same-repository, non-draft PRs that touch the covered files (or when the file check
    # failed, so a broken check can't wave a PR through). Otherwise skipped, which counts as
    # passing for a required check. A fork PR is always skipped, so it never runs with the key;
    # its change is evaluated on master after merge. Pushes to master and manual runs always run.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true')))
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@4a19484f7c6b6b09ee22dac63f0c6c9edb691097 # master

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 - https://github.com/astral-sh/setup-uv/releases
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify the lockfile is current
        # `make evals` installs what it needs through `uv run --locked`; this fails the job early,
        # and with a clear message, when uv.lock no longer matches pyproject.toml.
        run: make install_dev

      - name: Check the Gemini API key is available
        env:
          GEMINI_API_KEY: ${{ secrets.INTENT_AGENT_GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::INTENT_AGENT_GEMINI_API_KEY secret is not set - the eval suite needs a real Gemini key"
            exit 1
          fi

      - name: Run golden eval suite
        id: evals
        env:
          GEMINI_API_KEY: ${{ secrets.INTENT_AGENT_GEMINI_API_KEY }}
          # Settings needs these to construct; the suite serves fixture schemas in-process and
          # never introspects a token or writes an audit record, so placeholders are enough.
          INDYKITE_BASE_URL: https://ikg.invalid
          IK_APP_AGENT_KEY: not-used-by-the-eval-suite
          INTROSPECT_URL: https://idp.invalid/introspect
          INTROSPECT_CLIENT_ID: not-used-by-the-eval-suite
          INTROSPECT_CLIENT_SECRET: not-used-by-the-eval-suite
          AUDIT_DELIVERY: file
          AUDIT_FILE_STORAGE_PATH: ${{ runner.temp }}/audit
          AUDIT_FILE_FORMAT: json
          AUDIT_FILE_ROTATION_STRATEGY: time
        # The same command as a local run, reports included (Makefile: EVAL_REPORT_DIR, EVAL_CONCURRENCY).
        run: make evals

      # The two steps below must also run when `make evals` failed, which is the normal way a gate
      # regression arrives: that is what the report is needed for. They are skipped on a cancelled
      # run, and the hashFiles guard keeps a run that died before writing a report (a fixture error)
      # from piling missing-file failures on top of the real one.
      - name: Publish the per-category breakdown to the job summary
        if: ${{ !cancelled() && hashFiles('tmp/evals/report.md') != '' }}
        run: cat tmp/evals/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: actions/upload-artifact/eval-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 - https://github.com/actions/upload-artifact/releases
        if: ${{ !cancelled() && hashFiles('tmp/evals/report.md') != '' }}
        with:
          name: eval-report
          path: tmp/evals/
          if-no-files-found: error

      - name: Add comment to PR
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0 - https://github.com/mshick/add-pr-comment/releases
        # Same-repository PRs only: a fork PR's token is read-only whatever `permissions` asks for,
        # so the comment would fail a job whose evals passed. Forks keep the summary and artifact.
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('tmp/evals/report.md') != '' }}
        with:
          message-id: golden-eval-suite
          message-path: tmp/evals/report.md
