---
name: release-please

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
    # exclude changes to non-code files, i.e. CI/CD tooling configs
    paths-ignore:
      - 'CODEOWNERS'
      - '.github/**'
      - '.checkov.*'
      - '.deepsource.toml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.hadolint.*'
      - '.markdownlint.*'
      - '.pre-commit-config.*'
      - '.shellcheckrc'
      - '.trivy*'
      - '.yamlfmt.*'
      - '.yamllint.*'

concurrency:
  group: release-please
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    timeout-minutes: 10
    runs-on: ubuntu-slim
    steps:
      - name: Mint ik-code-writer installation token
        id: code_writer_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 - https://github.com/actions/create-github-app-token/releases
        with:
          client-id: ${{ vars.IK_CODE_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.IK_CODE_WRITER_PEM }}
          owner: indykite
          repositories: intent-agent

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0 - https://github.com/googleapis/release-please-action/releases
        with:
          token: ${{ steps.code_writer_token.outputs.token }}
