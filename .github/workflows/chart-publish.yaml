---
name: Helm Chart Publish

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: ["master"]
    paths:
      - "chart/**"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["master"]
    paths:
      - "chart/**"

concurrency:
  group: chart-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Artifact Registry
    timeout-minutes: 10
    runs-on: ubuntu-slim
    if: github.event.pull_request.draft != true
    steps:
      - name: actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 - https://github.com/actions/checkout/releases

      - name: Publish to Artifact Registry
        uses: indykite/ops-common/.github/actions/chart-publish@ae5cdc631e7e14ae44b4bb8b965204825c7c7d0d # master
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          artifact-registry-url: "${{ vars.ARTIFACT_REGISTRY_URL }}/${{ secrets.GCP_PROJECT_ID_MGMT }}/indykite"
          immutable-tags: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
