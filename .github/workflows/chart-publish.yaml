---
name: Helm Chart Publish

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: ["master"]
    paths:
      - "chart/**"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["master"]
    paths:
      - "chart/**"

concurrency:
  group: chart-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Artifact Registry
    timeout-minutes: 10
    runs-on: ubuntu-slim
    if: github.event.pull_request.draft != true
    steps:
      - name: actions/checkout
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Publish to Artifact Registry
        uses: indykite/ops-common/.github/actions/chart-publish@6fe294a0d80ed178dfd2294ac70aaab06b3c64e8 # master
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          artifact-registry-url: "${{ vars.ARTIFACT_REGISTRY_URL }}/${{ secrets.GCP_PROJECT_ID_MGMT }}/indykite"
          immutable-tags: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
