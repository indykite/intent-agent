---
# Inspired by https://github.com/orgs/community/discussions/51403#discussioncomment-5535167
name: Comment Code Coverage Artifact URL on PR

on: # yamllint disable-line rule:truthy
  workflow_run:
    types:
      - completed
    workflows:
      - Build Python project for PR

permissions:
  contents: read # required by checkout
  actions: read # required by 'artifact-to-comment' action to access '.../actions/artifacts' API
  pull-requests: write # required to create/update PR comments

jobs:
  pull-request-comment:
    timeout-minutes: 5
    # Same-repository PRs only: for a fork PR, GitHub leaves workflow_run.pull_requests empty, so
    # there is no PR to comment on.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-slim
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@f8d1bb0617b01f9e97c8b90c424e155e766d56ed # master

      - name: Comment Artifact URL on PR
        uses: indykite/.github/.github/actions/artifact-to-comment@f8d1bb0617b01f9e97c8b90c424e155e766d56ed # master
        with:
          artifact-name: code-coverage
          artifact-title: Code Coverage
