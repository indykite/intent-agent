---
# Inspired by https://github.com/orgs/community/discussions/51403#discussioncomment-5535167
name: Comment Code Coverage Artifact URL on PR

on: # yamllint disable-line rule:truthy
  workflow_run:
    types:
      - completed
    workflows:
      - Build Python project for PR

permissions:
  contents: read # required by checkout
  actions: read # required by 'artifact-to-comment' action to access '.../actions/artifacts' API
  pull-requests: write # required to create/update PR comments

jobs:
  pull-request-comment:
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@db523df1024e797b232faefcb9835954734d1331 # master

      - name: Comment Artifact URL on PR
        uses: indykite/.github/.github/actions/artifact-to-comment@db523df1024e797b232faefcb9835954734d1331 # master
        with:
          artifact-name: code-coverage
          artifact-title: Code Coverage
