---
name: Build & publish release artifacts

on: # yamllint disable-line rule:truthy
  release:
    types:
      - published

concurrency:
  group: publish-release
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: write # Read required by checkout, write required by gh release upload

jobs:
  release-python:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    outputs:
      image-version: ${{ steps.extract-version.outputs.image-version }}

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: Extract version name
        id: extract-version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "image-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: actions/checkout
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 - https://github.com/astral-sh/setup-uv/releases

      - name: Build project using composite action
        uses: indykite/ops-common/.github/actions/python-build@2bad817f6a49b2c70bff876916615a7f6d5c2125 # master
        id: build_python
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13
