---
name: Build & publish release artifacts

on: # yamllint disable-line rule:truthy
  release:
    types:
      - published

concurrency:
  group: publish-release
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: write # Read required by checkout, write required by gh release upload

jobs:
  release-python:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    outputs:
      image-version: ${{ steps.extract-version.outputs.image-version }}

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: Extract version name
        id: extract-version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "image-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: actions/checkout
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 - https://github.com/astral-sh/setup-uv/releases

      - name: Build project using composite action
        uses: indykite/ops-common/.github/actions/python-build@4c4cb34f01107182013dd8fe8a9de28ba7958153 # master
        id: build_python
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13

  deploy-rc:
    name: Deploy to rc
    timeout-minutes: 3
    runs-on: ubuntu-latest
    needs: [release-python]
    steps:
      - name: actions/checkout//ml-argocd-applications
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution
        with:
          repository: indykite/ml-argocd-applications
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY_ML_ARGOCD_APPLICATIONS }}

      - name: Update chart version to new release on rc
        run: |
          yq -i '.chartTargetRevision = "${{ needs.release-python.outputs.image-version }}"' apps/ml-charts/intent-agent/chart-version-rc.yaml

      - name: Commit & push new release version
        run: |-
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Updated intent-agent chart on rc to version ${{ needs.release-python.outputs.image-version }}"
          git push
