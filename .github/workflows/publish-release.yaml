---
name: Build & publish release artifacts

on: # yamllint disable-line rule:truthy
  release:
    types:
      - published

concurrency:
  group: publish-release
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: write # Read required by checkout, write required by gh release upload

jobs:
  release-python:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    outputs:
      image-version: ${{ steps.extract-version.outputs.image-version }}

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: Extract version name
        id: extract-version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "image-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 - https://github.com/actions/checkout/releases

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 - https://github.com/astral-sh/setup-uv/releases

      - name: Build project using composite action
        id: build_python
        uses: indykite/ops-common/.github/actions/python-build@ae5cdc631e7e14ae44b4bb8b965204825c7c7d0d # master
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13

