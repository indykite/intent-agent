---
name: Build Python project for PR

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # exclude changes to non-code files, i.e. CI/CD tooling configs
    paths-ignore:
      - 'CODEOWNERS'
      - '.github/**'
      - '.checkov.*'
      - '.deepsource.toml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.hadolint.*'
      - '.markdownlint.*'
      - '.pre-commit-config.*'
      - '.shellcheckrc'
      - '.trivy*'
      - '.yamlfmt.*'
      - '.yamllint.*'

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # required by checkout
  pull-requests: write # required by mshick/add-pr-comment

jobs:
  build-python:
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@090400ef7730777de9f272c7a833c04c80373f07 # master

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 - https://github.com/astral-sh/setup-uv/releases

      - name: Build Python project using composite action
        uses: indykite/.github/.github/actions/python-build@090400ef7730777de9f272c7a833c04c80373f07 # master
        id: build_python
        env:
          CUDA_VISIBLE_DEVICES: ""
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13
          # release-please PRs only bump version/changelog files; nothing new to report to codecov.
          # The branch name alone is user-controlled, so also require the PR to come from this
          # repository and be authored by the release-please app.
          upload-coverage: >-
            ${{ !(startsWith(github.head_ref, 'release-please--branches--master')
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.user.login == 'ik-code-writer[bot]') }}

      - name: Add comment to PR
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0 - https://github.com/mshick/add-pr-comment/releases
        # Same-repository PRs only: a fork PR's token is read-only, so the comment would fail a
        # build whose tests passed. Forks keep the coverage artifact.
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          message: ${{ steps.build_python.outputs.coverage }}
