---
name: Build Python project for PR

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # exclude changes to non-code files, i.e. CI/CD tooling configs
    paths-ignore:
      - 'CODEOWNERS'
      - '.github/**'
      - '.checkov.*'
      - '.deepsource.toml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.hadolint.*'
      - '.markdownlint.*'
      - '.pre-commit-config.*'
      - '.shellcheckrc'
      - '.trivy*'
      - '.yamlfmt.*'
      - '.yamllint.*'

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # required by checkout
  pull-requests: write # required by mshick/add-pr-comment

jobs:
  build-python:
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: actions/checkout
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 - https://github.com/astral-sh/setup-uv/releases

      - name: Build Python project using composite action
        uses: indykite/ops-common/.github/actions/python-build@6fe294a0d80ed178dfd2294ac70aaab06b3c64e8 # master
        id: build_python
        env:
          CUDA_VISIBLE_DEVICES: ""
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13

      - name: Add comment to PR
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0 - https://github.com/mshick/add-pr-comment/releases
        with:
          message: ${{ steps.build_python.outputs.coverage }}
