---
name: Build Python project for master

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
    # exclude changes to non-code files, i.e. CI/CD tooling configs
    paths-ignore:
      - 'CODEOWNERS'
      - '.github/**'
      - '.checkov.*'
      - '.deepsource.toml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.hadolint.*'
      - '.markdownlint.*'
      - '.pre-commit-config.*'
      - '.shellcheckrc'
      - '.trivy*'
      - '.yamlfmt.*'
      - '.yamllint.*'

concurrency:
  group: master-build
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # required by checkout

jobs:
  build-python:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: actions/checkout
        uses: indykite/ops-common/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 - https://github.com/astral-sh/setup-uv/releases

      - name: Build project using composite action
        uses: indykite/ops-common/.github/actions/python-build@24a0129d778a885b675f5d587ddc5255225a0c42 # master
        id: build_python
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13
