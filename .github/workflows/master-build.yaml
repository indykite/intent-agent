---
name: Build Python project for master

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
    # exclude changes to non-code files, i.e. CI/CD tooling configs
    paths-ignore:
      - 'CODEOWNERS'
      - '.github/**'
      - '.checkov.*'
      - '.deepsource.toml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.hadolint.*'
      - '.markdownlint.*'
      - '.pre-commit-config.*'
      - '.shellcheckrc'
      - '.trivy*'
      - '.yamlfmt.*'
      - '.yamllint.*'

concurrency:
  group: master-build
  cancel-in-progress: true

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # required by checkout

jobs:
  build-python:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 - https://github.com/actions/checkout/releases

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 - https://github.com/astral-sh/setup-uv/releases

      - name: Build project using composite action
        id: build_python
        uses: indykite/ops-common/.github/actions/python-build@cd7081295c7d8144b29aa9ec2002df4cac269f5b # master
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          python-version: 3.13
