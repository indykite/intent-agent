---
# This is a config file for https://app.codecov.io/
# Docs: https://docs.codecov.com/docs/common-recipe-list
# Validation:
# cat codecov.yml | curl --data-binary @- https://codecov.io/validate
coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%

    patch:
      default:
        target: 90%
        threshold: 1%

# Bumped by release-please on every release commit; nothing to test.
ignore:
  - "indykite/intent_agent/version.py"
