---
#
# Usage & installation, the first configures the default stages only, the others must be installed explicitly:
#   pre-commit install
#   pre-commit install -t post-checkout -t commit-msg
#
# Prerequisites:
#   ! hard dependency on the public 'indykite/.github' repo being cloned in the same root folder (../.github), so shareable commitlint config can be used!
#   ! keep the below line updated! It's parsed and used for dependency installation by shared workflow: indykite/.github//.github/workflows/pre-commit.yaml
#   brew install yamlfmt yamllint actionlint markdownlint-cli2 shellcheck shfmt checkov trivy hadolint uv helm kubeconform
#
# Update hooks and their dependencies regularly via:
#   (remote) pre-commit autoupdate --freeze --jobs $(getconf _NPROCESSORS_ONLN)
#   (local) brew update && brew upgrade -g
#
# using '[pre-commit, pre-push]' duplicates the checks
# if any checks are missing, override their default stage explicitly below
default_stages: [pre-commit, pre-push]
default_install_hook_types: [pre-commit]
fail_fast: false
minimum_pre_commit_version: 4.0.0
exclude: |
  (?x)^(
      CHANGELOG.md|
      .release-please-manifest.json
  )$

repos:
  - repo: meta
    hooks:
      # - id: check-hooks-apply
      - id: check-useless-excludes
        name: pre-commit/check-useless-excludes

  # Must run before the Helm hooks below (helm-kubeconform, and helmlint further
  # down) - chart/charts/ isn't committed (see chart/Chart.lock and .gitignore), so
  # `helm template`/`helm lint` would otherwise hard-fail with "found in Chart.yaml, but missing
  # in charts/ directory". `helm dependency build` (not `update`) resolves strictly from
  # chart/Chart.lock - no re-resolution, so this can't silently drift to a newer chart version.
  - repo: local
    hooks:
      - id: helm-dependency-build
        name: helm-dependency-build
        language: system
        entry: helm dependency build chart/
        files: ^chart/
        pass_filenames: false

  # Hooks shared across IndyKite repositories, defined here rather than pulled from a private
  # repository, so the config initialises without any credentials (fork PRs included).
  - repo: local
    hooks:
      # NON-DEFAULT stage, install explicitly with: pre-commit install -t post-checkout
      - id: git-pull
        name: git pull
        entry: bash -c '[[ $(git branch --show-current) =~ ^(dev|develop|main|master)$ ]] && git pull --all || true'
        language: system
        stages: [post-checkout]
        verbose: true
        always_run: true
        pass_filenames: false
      - id: git-branch-delete-stale
        name: Delete stale committed branches
        entry: >-
          bash -c '[[ $(git branch --show-current) =~ ^(dev|develop|main|master)$ ]] \
            && (git fetch -p && git branch -vv | grep ":\ gone]" | awk "{ print \$1 }" | xargs git branch -D) \
            || true'
        language: system
        stages: [post-checkout]
        verbose: true
        always_run: true
        pass_filenames: false

      # pre-commit validations
      - id: pre-commit-validate-config
        name: pre-commit/validate-config
        files: .pre-commit-config.yaml
        entry: pre-commit validate-config
        language: system
        pass_filenames: false
      - id: pre-commit-validate-manifest
        name: pre-commit/validate-manifest
        files: .pre-commit-config.yaml
        entry: pre-commit validate-manifest
        language: system
        pass_filenames: false

      - id: codecov-validate-config
        name: codecov-validate-config
        files: codecov.yml
        entry: >-
          bash -c '
          curl -s -o - -w "\n%{http_code}\n" --data-binary @codecov.yml https://codecov.io/validate
          | awk '"'"'{l[NR]=$0} END{for(i=1;i<NR;i++)print l[i]; if($0<200||$0>299)exit $0}'"'"''
        language: system
        pass_filenames: false

      # SAST
      - id: trivy
        name: trivy
        entry: trivy filesystem --disable-telemetry --skip-version-check --exit-code=1 --config .trivy.yaml .
        language: system
        pass_filenames: false

      # Shellcheck
      - id: shfmt
        name: shfmt
        types: [shell]
        exclude_types: [csh, tcsh, zsh]
        entry: shfmt
        args: [--list, --write, --diff, --indent, "4"]
        language: system
        pass_filenames: true
      - id: shellcheck
        name: shellcheck
        files: .*\.sh$
        entry: shellcheck -S style -o all
        language: system
        pass_filenames: true

      # Helm
      - id: helm-kubeconform
        name: helm-kubeconform
        entry: .github/scripts/pre-commit-kubeconform-helm.sh
        language: script
        files: ^chart/
        pass_filenames: false
      - id: helm-chart-version
        name: helm-chart-version
        entry: .github/scripts/pre-commit-check-helm-version.sh
        language: script
        files: ^chart/
        pass_filenames: false

  #
  # Renovate
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: "42ce3a76122fe740d44470f11009250124fa3e05" # frozen: 44.33.2
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  #
  # Commit Message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347 # frozen: v9.26.0
    hooks:
      # NON-DEFAULT stage, install explicitly with: pre-commit install -t commit-msg
      - id: commitlint
        stages: [commit-msg]
        # using shareable config across the org
        # 'strict' equals to 'failOnWarnings' in Github Action setting
        args: ["--strict", "--config", "../.github/.github/actions/commitlint/.commitlintrc.mjs"]
        additional_dependencies:
          - "@commitlint/config-conventional"
          - commitlint-plugin-function-rules

  #
  # Detect hardcoded secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # frozen: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Git style
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules
      # - id: forbid-submodules # XXX: either of two is enough
      - id: no-commit-to-branch
        name: no-commit-to-master
        args: [--branch, dev, --branch, master, --branch, main]

      # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # exclude: CHANGELOG.md
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks

      # Cross platform
      # - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

      # Format linters
      # 'check-yaml' and 'sort-simple-yaml' disabled intentionally, use hooks below
      - id: check-xml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: [--no-sort-keys, --autofix]

      # Security
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

      # Python
      - id: check-ast
        name: python-check-ast
      - id: check-builtin-literals
        name: python-check-builtin-literals
      - id: check-docstring-first
        name: python-check-docstring-first
      - id: debug-statements
        name: python-debug-statements
      - id: name-tests-test
        name: python-name-tests-test
        args: [--pytest-test-first]
        files: test/.*\.py$
      - id: requirements-txt-fixer
        name: python-requirements-txt-fixer

  #
  # more Python
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7 # frozen: v0.25
    hooks:
      - id: validate-pyproject
        name: python-validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: b84c4a0a90bd58c7d82ae8f0d4d5e77b1ddd3ce6 # frozen: 0.12.5
    hooks:
      - id: uv-lock
        name: python-uv-lock
      - id: uv-lock
        name: python-uv-lock-upgrade
        verbose: true
        args: [--dry-run, --upgrade] # TODO: consider removing '--dry-run' for automation

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3 # frozen: v0.16.3
    hooks:
      - id: ruff-format
        name: python-ruff-format
      - id: ruff-check
        name: python-ruff-check
        args: [--fix] # enable autofixes

  #
  # YAML
  - repo: local
    hooks:
      # place any overrides in '.actionlint.yaml' https://github.com/rhysd/actionlint/blob/main/docs/config.md
      #  args: ["-config-file=.actionlint.yaml"]
      - id: actionlint-system
        name: github-actionlint
        language: system
        entry: actionlint
        types: ["yaml"]
        files: ^\.github/workflows/
  # - repo: https://github.com/google/yamlfmt <- "language: golang" slower & takes larger CI cache comparing to "system"
  #   rev: v0.17.2
  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt
        language: system
        entry: yamlfmt
        types: [yaml]
  # - repo: https://github.com/adrienverge/yamllint <- "language: python" slower & takes larger CI cache comparing to "system"
  #   rev: v1.37.1
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        language: system
        entry: yamllint
        args: ["--strict"]
        types: [file, yaml]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint # language: system
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint
        name: hadolint/dockerfile

  #
  # Markdown
  # keep it after 'terraform-docs' update, so newly generated/updated files can be verified
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        language: system

  #
  # Helm charts
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: 40f924cd642f5dc98d12bd97b07f3752223553da # frozen: v0.1.30
    hooks:
      - id: helmlint
        name: helmlint

  #
  # IaC in general
  - repo: https://github.com/bridgecrewio/checkov
    rev: "5458c889320a19ccf2e2eed54beb4c661c70f67a" # frozen: 3.3.11
    hooks:
      - id: checkov_diff
        name: iac/checkov
