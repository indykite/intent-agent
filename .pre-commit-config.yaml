---
#
# Usage & installation, the first configures the default stages only, the others must be installed explicitly:
#   pre-commit install
#   pre-commit install -t post-checkout -t commit-msg
#
# Prerequisites:
#   ! hard dependency on 'ops-common' repo being in the same root folder, so shareable commitlint config can be used!
#   ! keep the below line updated! It's parsed and used for dependency installation by shared GitHub Workflow: ops-common//.github/workflows/pre-commit.yaml
#   brew install yamlfmt yamllint actionlint markdownlint-cli2 shellcheck shfmt checkov trivy hadolint uv helm kubeconform
#
# Update hooks and their dependencies regularly via:
#   (remote) pre-commit autoupdate --jobs $(getconf _NPROCESSORS_ONLN)
#   (local) brew update && brew upgrade -g
# TODO: do NOT use '--freeze' until https://github.com/renovatebot/renovate/issues/22567 is completed
#
# using '[pre-commit, pre-push]' duplicates the checks
# if any checks are missing, override their default stage explicitly below
default_stages: [pre-commit, pre-push]
default_install_hook_types: [pre-commit]
fail_fast: false
minimum_pre_commit_version: 4.0.0
exclude: |
  (?x)^(
      CHANGELOG.md|
      .release-please-manifest.json
  )$

repos:
  - repo: meta
    hooks:
      # - id: check-hooks-apply
      - id: check-useless-excludes
        name: pre-commit/check-useless-excludes

  - repo: ssh://git@github.com/indykite/ops-common
    rev: "d8b3d3da7eed0bb4aa987ddb938ce1d7a07f4189" # using a branch name (or HEAD) is not supported
    hooks:
      # NON-DEFAULT stage, install explicitly with: pre-commit install -t post-checkout
      - id: git-pull
      - id: git-branch-delete-stale

      # pre-commit validations
      # - id: pre-commit-autoupdate # done via 'renovate'; left for reference and possible options
      #   args: [--freeze] # store hashes in 'rev' instead of tag names
      - id: pre-commit-validate-config
      - id: pre-commit-validate-manifest

      - id: codecov-validate-config

      # SAST
      - id: trivy

      # Shellcheck
      - id: shfmt
      - id: shellcheck

      # Helm
      - id: helm-kubeconform
        files: ^chart/

      - id: helm-chart-version
        files: ^chart/

  #
  # Renovate
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: "42.81.3"
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  #
  # Commit Message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      # NON-DEFAULT stage, install explicitly with: pre-commit install -t commit-msg
      - id: commitlint
        stages: [commit-msg]
        # using shareable config across the org
        # 'strict' equals to 'failOnWarnings' in Github Action setting
        args: ["--strict", "--config", "../ops-common/.github/actions/commitlint/.commitlintrc.mjs"]
        additional_dependencies:
          - "@commitlint/config-conventional"
          - commitlint-plugin-function-rules

  #
  # Detect hardcoded secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Git style
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules
      # - id: forbid-submodules # XXX: either of two is enough
      - id: no-commit-to-branch
        name: no-commit-to-master
        args: [--branch, dev, --branch, master, --branch, main]

      # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # exclude: CHANGELOG.md
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks

      # Cross platform
      # - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

      # Format linters
      # 'check-yaml' and 'sort-simple-yaml' disabled intentionally, use hooks below
      - id: check-xml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: [--no-sort-keys, --autofix]

      # Security
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

      # Python
      - id: check-ast
        name: python-check-ast
      - id: check-builtin-literals
        name: python-check-builtin-literals
      - id: check-docstring-first
        name: python-check-docstring-first
      - id: debug-statements
        name: python-debug-statements
      - id: name-tests-test
        name: python-name-tests-test
        args: [--pytest-test-first]
        files: test/.*\.py$
      - id: requirements-txt-fixer
        name: python-requirements-txt-fixer

  #
  # more Python
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        name: python-validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.25
    hooks:
      - id: uv-lock
        name: python-uv-lock
      - id: uv-lock
        name: python-uv-lock-upgrade
        verbose: true
        args: [--dry-run, --upgrade] # TODO: consider removing '--dry-run' for automation

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff-format
        name: python-ruff-format
      - id: ruff-check
        name: python-ruff-check
        args: [--fix] # enable autofixes

  #
  # YAML
  - repo: local
    hooks:
      # place any overrides in '.actionlint.yaml' https://github.com/rhysd/actionlint/blob/main/docs/config.md
      #  args: ["-config-file=.actionlint.yaml"]
      - id: actionlint-system
        name: github-actionlint
        language: system
        entry: actionlint
        types: ["yaml"]
        files: ^\.github/workflows/
  # - repo: https://github.com/google/yamlfmt <- "language: golang" slower & takes larger CI cache comparing to "system"
  #   rev: v0.17.2
  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt
        language: system
        entry: yamlfmt
        types: [yaml]
  # - repo: https://github.com/adrienverge/yamllint <- "language: python" slower & takes larger CI cache comparing to "system"
  #   rev: v1.37.1
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        language: system
        entry: yamllint
        args: ["--strict"]
        types: [file, yaml]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint # language: system
    rev: v2.14.0
    hooks:
      - id: hadolint
        name: hadolint/dockerfile

  #
  # Markdown
  # keep it after 'terraform-docs' update, so newly generated/updated files can be verified
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        language: system

  #
  # Helm charts
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
        name: helmlint

  #
  # IaC in general
  - repo: https://github.com/bridgecrewio/checkov
    rev: "e52a901a3829d818d20c9b75e544845c8b756968" # frozen: 3.2.526
    hooks:
      - id: checkov_diff
        name: iac/checkov
