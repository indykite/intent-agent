---
# https://trivy.dev/latest/docs/references/configuration/config-file/
report: "all"
exit-code: 1
insecure: false
debug: false
quiet: true
timeout: 10m
dependency-tree: true
list-all-pkgs: true
format: "table"
ignorefile: .trivyignore.yaml

severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

# [EXPERIMENTAL] tables that will be displayed in 'table' format, default '[summary,detailed]'
# explicit setting breaks CI's 'github' format
# table-mode:
#   - summary
#   - detailed

scan:
  detection-priority: "precise"
  disable-telemetry: true
  offline: true
  scanners:
    # - vuln # keep disabled so not checked on PRs but explicitly via scheduled .github/workflows/pre-commit-cache.yaml
    - secret
    - misconfig
    - license # while enabled but run via the separate 'trivy-license' action
  skip-files: [".env"]
  show-suppressed: true

vulnerability:
  ignore-unfixed: false

misconfiguration:
  include-non-failures: false
  scanners:
    - dockerfile
    - helm
    - kubernetes
    - terraform
    - terraformplan-json
    - terraformplan-snapshot

  terraform:
    exclude-downloaded-modules: true

rego:
  # Same as '--config-data'
  data: [.trivy_data.yaml]
license:
  confidenceLevel: 0.9
  full: true
  ignored: []

# Non-standard Trivy config; consumed only by custom CI.
notify:
  slack:
    channel: "#team-engineering-ml"
  jira:
    team: "ML"
