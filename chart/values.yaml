---
replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/placeholder
  name: intent-agent
  pullPolicy: Always
  # Blank defaults to Chart.yaml's appVersion (see templates/deployment.yaml) - the
  # release-please-managed version. Per-environment values files (values-dev.yaml,
  # values-rc.yaml) override this explicitly with the actual deployed image tag.
  tag: ""

# app.* mirrors indykite/intent_agent/config.py's Settings fields 1:1 (env var names
# in comments match .env.example). Keep the two in sync when Settings gains a field.
app:
  # advertisedHost left blank defaults to the in-cluster Service DNS name (service.fullname),
  # which is what the A2A agent card needs callers to reach - see agent.py's `_rpc_url`.
  advertisedHost: ""
  intentPort: 6003 # INTENT_PORT
  healthPort: 8001 # HEALTH_PORT
  intentAgentName: "intent_agent" # INTENT_AGENT_NAME
  logLevel: "INFO" # LOG_LEVEL

  geminiModel: "gemini-3.5-flash-lite" # GEMINI_MODEL
  # Size of the dedicated schema/policy-fetch thread pool, not a request-concurrency limit -
  # see config.py's Settings.fetch_executor_max_workers.
  fetchExecutorMaxWorkers: 8 # FETCH_EXECUTOR_MAX_WORKERS
  toolCallMaxIterations: 5 # TOOL_CALL_MAX_ITERATIONS
  schemaPreviewChars: 12000 # SCHEMA_PREVIEW_CHARS
  llmTimeoutSeconds: 3.0 # LLM_TIMEOUT_SECONDS
  requestTimeoutSeconds: 10.0 # REQUEST_TIMEOUT_SECONDS
  validationMaxRetries: 1 # VALIDATION_MAX_RETRIES

  indykiteBaseUrl: "https://placeholder.example.com" # INDYKITE_BASE_URL
  # llmTimeoutSeconds/schemaFetchTimeoutSeconds/policyFetchTimeoutSeconds must each stay <=
  # requestTimeoutSeconds (Settings rejects a fetch/LLM timeout that could never fire before the
  # whole-request deadline does - enforced here too by service.validateTimeouts, not just the
  # Python validator, so a bad combination fails `helm install`/`helm template` instead of
  # crash-looping the pod at startup) - both fetch timeouts are tight ceilings sized to leave
  # room for the LLM calls in the same budget, not a generous allowance in their own right; tune
  # against the platform's observed latency.
  schemaFetchTimeoutSeconds: 3.0 # SCHEMA_FETCH_TIMEOUT_SECONDS
  schemaRefreshTtlMinutes: 5.0 # SCHEMA_REFRESH_TTL_MINUTES

  policyFetchTimeoutSeconds: 2.0 # POLICY_FETCH_TIMEOUT_SECONDS
  policyRefreshTtlMinutes: 5.0 # POLICY_REFRESH_TTL_MINUTES
  policyFetchRetryAttempts: 2 # POLICY_FETCH_RETRY_ATTEMPTS
  policyPreviewChars: 12000 # POLICY_PREVIEW_CHARS

  cacheBackend: "memory" # CACHE_BACKEND - "memory" or "redis"

  # Required (redisUrlSecretRef.name must be set) when cacheBackend is "redis" - Settings fails
  # fast at startup otherwise. REDIS_URL - example secret value: "redis://redis:6379"
  redisUrlSecretRef:
    name: ""
    key: ""

  introspectUrl: "https://placeholder.example.com" # INTROSPECT_URL
  introspectClientId: "placeholder" # INTROSPECT_CLIENT_ID
  introspectTimeoutSeconds: 5.0 # INTROSPECT_TIMEOUT_SECONDS
  # The `aud` value this agent expects on an incoming access token - independent of
  # advertisedHost/intentPort, since those are deployment topology, not what an external IdP was
  # configured to stamp into `aud` for this resource. Defaults to intentAgentName; override only
  # if the IdP registers a different identifier for this agent.
  expectedTokenAudience: "intent_agent" # EXPECTED_TOKEN_AUDIENCE

  # Audit log (TDD 4.9) - AUDIT_DELIVERY is required by Settings ("file" or "webhook", the Agent
  # Gateway's two delivery types); every request produces one record. With "file" the chart mounts
  # an emptyDir at auditFileStoragePath (the container root filesystem is read-only), so records
  # live only as long as the pod does - use "webhook" to ship them anywhere durable.
  auditDelivery: "file" # AUDIT_DELIVERY
  auditAsync: false # AUDIT_ASYNC
  auditAsyncBufferSize: 512 # AUDIT_ASYNC_BUFFER_SIZE
  auditFileStoragePath: "/var/log/intent-agent/audit" # AUDIT_FILE_STORAGE_PATH
  auditFileFormat: "json" # AUDIT_FILE_FORMAT - "csv", "json" or "txt"
  auditFileRotationStrategy: "size-and-time" # AUDIT_FILE_ROTATION_STRATEGY - "time", "size" or "size-and-time"
  auditFileRotationIntervalSeconds: 86400 # AUDIT_FILE_ROTATION_INTERVAL_SECONDS
  auditFileRotationMaxBytes: 104857600 # AUDIT_FILE_ROTATION_MAX_BYTES
  auditHttpUrl: "" # AUDIT_HTTP_URL - required when auditDelivery is "webhook"
  auditHttpMethod: "POST" # AUDIT_HTTP_METHOD - "POST" or "PUT"
  auditHttpAuthType: "no-auth" # AUDIT_HTTP_AUTH_TYPE - "mTLS", "no-auth" or "api-key"
  auditHttpApiKeyHeader: "X-API-Key" # AUDIT_HTTP_API_KEY_HEADER
  auditHttpTimeoutSeconds: 5.0 # AUDIT_HTTP_TIMEOUT_SECONDS
  # AUDIT_HTTP_API_KEY - required when auditHttpAuthType is "api-key"; set name/key to a secret.
  auditHttpApiKeySecretRef:
    name: ""
    key: ""
  # AUDIT_HTTP_MTLS_CERTIFICATE_FILE_PATH / AUDIT_HTTP_MTLS_PRIVATE_KEY_PATH - required when
  # auditHttpAuthType is "mTLS": the paths inside the container of a certificate and key. The chart
  # does not mount these.
  auditHttpMtlsCertificateFilePath: ""
  auditHttpMtlsPrivateKeyPath: ""

  # GEMINI_API_KEY - required, no default in Settings.
  geminiApiKeySecretRef:
    name: "intent-agent-secrets"
    key: "GEMINI_API_KEY"

  # INTROSPECT_CLIENT_SECRET - required, no default in Settings.
  introspectClientSecretRef:
    name: "intent-agent-secrets"
    key: "INTROSPECT_CLIENT_SECRET"

  # IK_APP_AGENT_KEY - required, no default in Settings.
  ikAppAgentKeySecretRef:
    name: "intent-agent-secrets"
    key: "IK_APP_AGENT_KEY"

  terminationGracePeriodSeconds: 30

  env: {}
  envFromSecrets: []
  #  envFromSecrets:
  #    - envVarName: FOO
  #      secretName: app-secret
  #      secretKey: foo-key

# Chart-managed Redis (Bitnami subchart, oci://registry-1.docker.io/bitnamicharts/redis) - opt-in,
# for self-contained/dev/ephemeral deployments only. Production/shared environments should keep
# using an externally managed Redis via app.redisUrlSecretRef instead - the two are mutually
# exclusive, not layered: app.redisUrlSecretRef.name/key must be empty whenever redis.enabled is
# true, or service.validateRedisConfig fails fast (see deployment.yaml's REDIS_URL env logic).
# Only architecture: standalone is supported - see service.validateRedisConfig.
#
# auth.enabled: false because the derived REDIS_URL (service.redisHost) can't safely embed a
# generated password at template time (would require `lookup`, which breaks `helm template`/CI
# rendering with no live cluster). This chart does not support using the chart-managed Redis with
# auth enabled; if you need an authenticated Redis, keep redis.enabled: false and set
# app.redisUrlSecretRef to a Secret containing a full authenticated REDIS_URL (DSN).
#
# master.persistence.enabled: false because this Redis only backs the app's schema cache
# (dogpile.cache, see agent.py) - losing cache contents on pod restart is harmless, and skipping
# the PVC avoids depending on a StorageClass being available in ephemeral/dev clusters (e.g. plain
# kind). Flip to true if you want the cache to survive pod restarts.
#
# The app pod can already reach this Redis pod under the default (permissive) networkPolicy.egress
# - if you lock networkPolicy.egress down per-environment, add a rule for the Redis pod too.
#
# image.digest pins docker.io/bitnami/redis to a specific build, same as this repo pins every
# other image (see docker-compose.yml's redis service, and Dockerfile's base images). Required
# here, not just convention: Bitnami's free-tier registry for this image no longer publishes
# dated/versioned tags at all (confirmed - only "latest" remains), so the chart's own upstream
# default (image.tag: latest) would otherwise float to whatever Bitnami pushes next with no
# warning. Re-pin by re-resolving `crane digest docker.io/bitnami/redis:latest` when bumping.
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  # renovate: datasource=docker depName=bitnami/redis
  image:
    tag: latest
    digest: "sha256:ffa455a3ad00bccc24dfde113ef55329dde687da242e9feb6ccd2b30eb93e8f3"
  master:
    persistence:
      enabled: false

fullnameOverride: ""

service:
  type: ClusterIP

serviceAccount:
  create: true
  # Blank generates a release-scoped name (service.serviceAccountName) - a fixed name here
  # would collide across multiple releases of this chart in the same namespace.
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  memoryUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}

imagePullSecrets: []

networkPolicy:
  enabled: true
  # Permissive by design (no isolation) - only guarantees a NetworkPolicy object exists.
  # Override with explicit peer/port selectors per-environment to actually restrict traffic.
  ingress:
    - {}
  egress:
    - {}

istio:
  enabled: false
  # Automatically enabled if istio.enabled and metricsPeerAuthentication.enabled are true
  metricsPeerAuthentication:
    enabled: true
    mtlsMode: "STRICT"
    portLevelMtlsMode: "PERMISSIVE"
  # Restricts who may reach the health/metrics port when istio.enabled and
  # metricsAuthorizationPolicy.enabled are true.
  # Left empty (no restriction) by default since the GKE Managed Prometheus collector's identity
  # varies by cluster; populate with its namespace/principals to lock this down per-environment.
  metricsAuthorizationPolicy:
    enabled: true
    namespaces: []
    principals: []
  destinationRule:
    enabled: false
  virtualService:
    enabled: false
    gateways:
      - mesh
    retries:
      attempts: 5
      perTryTimeout: 200s
      retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,gateway-error"
      retryRemoteLocalities: true
  authorizationPolicy:
    enabled: false
    namespaces: []
    principals: []
    internalCallers:
      sameNamespace:
        enabled: false
        serviceAccounts: []
      crossNamespace: []
    operations:
      - methods:
          - POST
        paths:
          - /

labels:
  environment: ""
