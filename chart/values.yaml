---
replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/placeholder
  name: intent-agent
  pullPolicy: Always
  tag: "0.0.0"

# app.* mirrors indykite/intent_agent/config.py's Settings fields 1:1 (env var names
# in comments match .env.example). Keep the two in sync when Settings gains a field.
app:
  # advertisedHost left blank defaults to the in-cluster Service DNS name (service.fullname),
  # which is what the A2A agent card needs callers to reach - see agent.py's `_rpc_url`.
  advertisedHost: ""
  intentPort: 6003 # INTENT_PORT
  healthPort: 8001 # HEALTH_PORT
  intentAgentName: "intent_agent" # INTENT_AGENT_NAME
  logLevel: "INFO" # LOG_LEVEL

  geminiModel: "gemini-3.5-flash-lite" # GEMINI_MODEL
  toolCallMaxIterations: 5 # TOOL_CALL_MAX_ITERATIONS
  schemaPreviewChars: 12000 # SCHEMA_PREVIEW_CHARS

  indykiteBaseUrl: "https://placeholder.example.com" # INDYKITE_BASE_URL
  schemaFetchTimeoutSeconds: 30.0 # SCHEMA_FETCH_TIMEOUT_SECONDS
  schemaRefreshTtlMinutes: 5.0 # SCHEMA_REFRESH_TTL_MINUTES

  cacheBackend: "memory" # CACHE_BACKEND - "memory" or "redis"

  # Required (redisUrlSecretRef.name must be set) when cacheBackend is "redis" - Settings fails
  # fast at startup otherwise. REDIS_URL - example secret value: "redis://redis:6379"
  redisUrlSecretRef:
    name: ""
    key: ""

  introspectUrl: "https://placeholder.example.com" # INTROSPECT_URL
  introspectClientId: "placeholder" # INTROSPECT_CLIENT_ID
  introspectTimeoutSeconds: 5.0 # INTROSPECT_TIMEOUT_SECONDS

  subjectType: "placeholder" # SUBJECT_TYPE

  # GEMINI_API_KEY - required, no default in Settings.
  geminiApiKeySecretRef:
    name: "intent-agent-secrets"
    key: "GEMINI_API_KEY"

  # INTROSPECT_CLIENT_SECRET - required, no default in Settings.
  introspectClientSecretRef:
    name: "intent-agent-secrets"
    key: "INTROSPECT_CLIENT_SECRET"

  # IK_APP_AGENT_KEY - required, no default in Settings.
  ikAppAgentKeySecretRef:
    name: "intent-agent-secrets"
    key: "IK_APP_AGENT_KEY"

  terminationGracePeriodSeconds: 30

  env: {}
  envFromSecrets: []
  #  envFromSecrets:
  #    - envVarName: FOO
  #      secretName: app-secret
  #      secretKey: foo-key

# Chart-managed Redis (Bitnami subchart, oci://registry-1.docker.io/bitnamicharts/redis) - opt-in,
# for self-contained/dev/ephemeral deployments only. Production/shared environments should keep
# using an externally managed Redis via app.redisUrlSecretRef instead - the two are mutually
# exclusive, not layered: app.redisUrlSecretRef.name/key must be empty whenever redis.enabled is
# true, or service.validateRedisConfig fails fast (see deployment.yaml's REDIS_URL env logic).
# Only architecture: standalone is supported - see service.validateRedisConfig.
#
# auth.enabled: false because the derived REDIS_URL (service.redisHost) can't safely embed a
# generated password at template time (would require `lookup`, which breaks `helm
# template`/CI rendering with no live cluster). If you need auth, point app.redisUrlSecretRef at a
# secret holding a full authenticated DSN instead of relying on derivation -
# service.validateRedisConfig fails fast if auth.enabled is true without that secret set.
#
# master.persistence.enabled: false because this Redis only backs the app's schema cache
# (dogpile.cache, see agent.py) - losing cache contents on pod restart is harmless, and skipping
# the PVC avoids depending on a StorageClass being available in ephemeral/dev clusters (e.g. plain
# kind). Flip to true if you want the cache to survive pod restarts.
#
# The app pod can already reach this Redis pod under the default (permissive) networkPolicy.egress
# - if you lock networkPolicy.egress down per-environment, add a rule for the Redis pod too.
#
# image.digest pins docker.io/bitnami/redis to a specific build, same as this repo pins every
# other image (see docker-compose.yml's redis service, and Dockerfile's base images). Required
# here, not just convention: Bitnami's free-tier registry for this image no longer publishes
# dated/versioned tags at all (confirmed - only "latest" remains), so the chart's own upstream
# default (image.tag: latest) would otherwise float to whatever Bitnami pushes next with no
# warning. Re-pin by re-resolving `crane digest docker.io/bitnami/redis:latest` when bumping.
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  # renovate: datasource=docker depName=bitnami/redis
  image:
    tag: latest
    digest: "sha256:d75bda00b778ad5e03a639ec36e00f6665a5d7e0f35a6250be5b103fb2117275"
  master:
    persistence:
      enabled: false

fullnameOverride: ""

service:
  type: ClusterIP

serviceAccount:
  create: true
  # Blank generates a release-scoped name (service.serviceAccountName) - a fixed name here
  # would collide across multiple releases of this chart in the same namespace.
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  memoryUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}

imagePullSecrets: []

networkPolicy:
  enabled: true
  # Permissive by design (no isolation) - only guarantees a NetworkPolicy object exists.
  # Override with explicit peer/port selectors per-environment to actually restrict traffic.
  ingress:
    - {}
  egress:
    - {}

istio:
  enabled: false
  # Automatically enabled if istio.enabled and metricsPeerAuthentication.enabled are true
  metricsPeerAuthentication:
    enabled: true
    mtlsMode: "STRICT"
    portLevelMtlsMode: "PERMISSIVE"
  # Restricts who may reach the health/metrics port when istio.enabled and
  # metricsAuthorizationPolicy.enabled are true.
  # Left empty (no restriction) by default since the GKE Managed Prometheus collector's identity
  # varies by cluster; populate with its namespace/principals to lock this down per-environment.
  metricsAuthorizationPolicy:
    enabled: true
    namespaces: []
    principals: []
  destinationRule:
    enabled: false
  virtualService:
    enabled: false
    gateways:
      - mesh
    retries:
      attempts: 5
      perTryTimeout: 200s
      retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,gateway-error"
      retryRemoteLocalities: true
  authorizationPolicy:
    enabled: false
    namespaces: []
    principals: []
    internalCallers:
      sameNamespace:
        enabled: false
        serviceAccounts: []
      crossNamespace: []
    operations:
      - methods:
          - POST
        paths:
          - /

labels:
  environment: ""
