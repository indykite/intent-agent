{{- include "service.validatePorts" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "service.labels" . | nindent 4 }}
    service: {{ .Chart.Name }}
  {{- if or .Values.annotations ((.Values.service).annotations) }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Helm static rendering uses namespace=default
    {{- if .Values.annotations }}
    {{- include "service.annotations" $ | nindent 4 }}
    {{- end }}
    {{- with ((.Values.service).annotations) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ ((.Values.service).type) | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.app.intentPort }}
      protocol: TCP
      targetPort: {{ .Values.app.intentPort }}
    - name: health
      port: {{ .Values.app.healthPort }}
      protocol: TCP
      targetPort: {{ .Values.app.healthPort }}
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
