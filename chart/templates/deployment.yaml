{{- include "service.validateCacheBackend" . }}
{{- include "service.validateRedisConfig" . }}
{{- include "service.validateTimeouts" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- include "service.annotations" $ | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checkov.io/skip: CKV_K8S_21=Helm static rendering uses namespace=default
        {{- if .Values.istio.enabled }}
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true, "terminationDrainDuration": "30s" }'
        {{- end }}
        {{- if .Values.annotations }}
        {{- include "service.annotations" $ | nindent 8 }}
        {{- end }}
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
        {{- with .Values.labels }}
        {{- /* Drop keys already emitted above - a custom label reusing one (e.g. "app") would
             desync the pod's actual label from what the Deployment/Service selector expects. */ -}}
        {{- with (omit . "app.kubernetes.io/name" "app.kubernetes.io/instance" "app" "version") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "service.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "service.fullname" . }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name | default .Chart.Name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: INTENT_PORT
              value: {{ .Values.app.intentPort | int64 | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.app.healthPort | int64 | quote }}
            - name: ADVERTISED_HOST
              value: {{ .Values.app.advertisedHost | default (include "service.fullname" .) | quote }}
            - name: INTENT_AGENT_NAME
              value: {{ .Values.app.intentAgentName | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: GEMINI_MODEL
              value: {{ .Values.app.geminiModel | quote }}
            - name: FETCH_EXECUTOR_MAX_WORKERS
              value: {{ .Values.app.fetchExecutorMaxWorkers | int64 | quote }}
            - name: TOOL_CALL_MAX_ITERATIONS
              value: {{ .Values.app.toolCallMaxIterations | int64 | quote }}
            - name: SCHEMA_PREVIEW_CHARS
              value: {{ .Values.app.schemaPreviewChars | int64 | quote }}
            - name: LLM_TIMEOUT_SECONDS
              value: {{ .Values.app.llmTimeoutSeconds | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.app.requestTimeoutSeconds | quote }}
            - name: VALIDATION_MAX_RETRIES
              value: {{ .Values.app.validationMaxRetries | int64 | quote }}
            - name: INDYKITE_BASE_URL
              value: {{ .Values.app.indykiteBaseUrl | quote }}
            - name: SCHEMA_FETCH_TIMEOUT_SECONDS
              value: {{ .Values.app.schemaFetchTimeoutSeconds | quote }}
            - name: SCHEMA_REFRESH_TTL_MINUTES
              value: {{ .Values.app.schemaRefreshTtlMinutes | quote }}
            - name: POLICY_FETCH_TIMEOUT_SECONDS
              value: {{ .Values.app.policyFetchTimeoutSeconds | quote }}
            - name: POLICY_REFRESH_TTL_MINUTES
              value: {{ .Values.app.policyRefreshTtlMinutes | quote }}
            - name: POLICY_FETCH_RETRY_ATTEMPTS
              value: {{ .Values.app.policyFetchRetryAttempts | int64 | quote }}
            - name: POLICY_PREVIEW_CHARS
              value: {{ .Values.app.policyPreviewChars | int64 | quote }}
            - name: CACHE_BACKEND
              value: {{ .Values.app.cacheBackend | quote }}
            {{- if .Values.app.redisUrlSecretRef.name }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.redisUrlSecretRef.name }}
                  key: {{ .Values.app.redisUrlSecretRef.key }}
            {{- else if ((.Values.redis).enabled) }}
            - name: REDIS_URL
              value: {{ printf "redis://%s:6379" (include "service.redisHost" .) | quote }}
            {{- end }}
            - name: INTROSPECT_URL
              value: {{ .Values.app.introspectUrl | quote }}
            - name: INTROSPECT_CLIENT_ID
              value: {{ .Values.app.introspectClientId | quote }}
            - name: INTROSPECT_TIMEOUT_SECONDS
              value: {{ .Values.app.introspectTimeoutSeconds | quote }}
            - name: EXPECTED_TOKEN_AUDIENCE
              value: {{ .Values.app.expectedTokenAudience | quote }}
            - name: AUDIT_DELIVERY
              value: {{ .Values.app.auditDelivery | quote }}
            - name: AUDIT_ASYNC
              value: {{ .Values.app.auditAsync | quote }}
            - name: AUDIT_ASYNC_BUFFER_SIZE
              value: {{ .Values.app.auditAsyncBufferSize | int64 | quote }}
            {{- if eq .Values.app.auditDelivery "file" }}
            - name: AUDIT_FILE_STORAGE_PATH
              value: {{ .Values.app.auditFileStoragePath | quote }}
            - name: AUDIT_FILE_FORMAT
              value: {{ .Values.app.auditFileFormat | quote }}
            - name: AUDIT_FILE_ROTATION_STRATEGY
              value: {{ .Values.app.auditFileRotationStrategy | quote }}
            - name: AUDIT_FILE_ROTATION_INTERVAL_SECONDS
              value: {{ .Values.app.auditFileRotationIntervalSeconds | quote }}
            - name: AUDIT_FILE_ROTATION_MAX_BYTES
              value: {{ .Values.app.auditFileRotationMaxBytes | int64 | quote }}
            {{- else }}
            - name: AUDIT_HTTP_URL
              value: {{ .Values.app.auditHttpUrl | quote }}
            - name: AUDIT_HTTP_METHOD
              value: {{ .Values.app.auditHttpMethod | quote }}
            - name: AUDIT_HTTP_AUTH_TYPE
              value: {{ .Values.app.auditHttpAuthType | quote }}
            - name: AUDIT_HTTP_API_KEY_HEADER
              value: {{ .Values.app.auditHttpApiKeyHeader | quote }}
            - name: AUDIT_HTTP_TIMEOUT_SECONDS
              value: {{ .Values.app.auditHttpTimeoutSeconds | quote }}
            {{- if .Values.app.auditHttpApiKeySecretRef.name }}
            - name: AUDIT_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.auditHttpApiKeySecretRef.name }}
                  key: {{ .Values.app.auditHttpApiKeySecretRef.key }}
            {{- end }}
            {{- if .Values.app.auditHttpMtlsCertificateFilePath }}
            - name: AUDIT_HTTP_MTLS_CERTIFICATE_FILE_PATH
              value: {{ .Values.app.auditHttpMtlsCertificateFilePath | quote }}
            {{- end }}
            {{- if .Values.app.auditHttpMtlsPrivateKeyPath }}
            - name: AUDIT_HTTP_MTLS_PRIVATE_KEY_PATH
              value: {{ .Values.app.auditHttpMtlsPrivateKeyPath | quote }}
            {{- end }}
            {{- end }}

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.geminiApiKeySecretRef.name }}
                  key: {{ .Values.app.geminiApiKeySecretRef.key }}
            - name: INTROSPECT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.introspectClientSecretRef.name }}
                  key: {{ .Values.app.introspectClientSecretRef.key }}
            - name: IK_APP_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.ikAppAgentKeySecretRef.name }}
                  key: {{ .Values.app.ikAppAgentKeySecretRef.key }}

            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

            {{- range .Values.app.envFromSecrets }}
            - name: {{ .envVarName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.intentPort }}
            - name: health
              containerPort: {{ .Values.app.healthPort }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if eq .Values.app.auditDelivery "file" }}
          volumeMounts:
            # The root filesystem is read-only, so file audit delivery needs somewhere writable.
            - name: audit-log
              mountPath: {{ .Values.app.auditFileStoragePath | quote }}
          {{- end }}
      {{- if eq .Values.app.auditDelivery "file" }}
      volumes:
        - name: audit-log
          emptyDir: {}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
