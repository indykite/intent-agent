{{- if and ((.Values.istio).enabled) (((.Values.istio).metricsAuthorizationPolicy).enabled) }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "service.suffixedName" (list . "-metrics") | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- include "service.annotations" $ | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - {{- with .Values.istio.metricsAuthorizationPolicy }}{{- if or .namespaces .principals }}
      from:
        - source:
            {{- with .namespaces }}
            namespaces:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .principals }}
            principals:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      {{- end }}{{- end }}
      to:
        - operation:
            ports:
              - {{ .Values.app.healthPort | quote }}
    {{- if not (((.Values.istio).authorizationPolicy).enabled) }}
    # Istio denies any request that doesn't match at least one ALLOW policy once one exists for
    # the workload - without this second, unrestricted rule, creating this policy alone (with the
    # main authorizationPolicy disabled) would cut off the main intentPort too. Only add it here
    # when that's the only ALLOW policy - otherwise (main policy enabled) this unrestricted rule
    # would additively bypass its restriction, since Istio ORs all ALLOW policies together.
    - to:
        - operation:
            ports:
              - {{ .Values.app.intentPort | quote }}
    {{- end }}
{{- end }}
