---
# These values are used by pre-commit helmlint and helm-kubeconform hooks
autoscaling:
  enabled: true

podDisruptionBudget:
  enabled: true

istio:
  enabled: true

redis:
  enabled: true

app:
  cacheBackend: "redis"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: intent-agent.example.com
