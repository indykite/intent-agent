[project]
name = "intent-agent"
description = "Intent Agent"
license = "Apache-2.0"
requires-python = "==3.13.*"
# Dynamic version is required to avoid writing the package version to uv.lock file
# otherwise uv lock --check fails on a new release, because the version is bumped and doesn't match.
# See https://github.com/astral-sh/uv/issues/7533
dynamic = ["version"]

# https://docs.astral.sh/uv/concepts/projects/dependencies/
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "cel-python==0.5.0",
    "dogpile.cache[redis]==1.5.0",
    "httpx2==2.16.0",
    "langchain-core==1.7.6",
    "langchain-google-genai==4.4.3",
    "lark==1.3.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "PyJWT==2.15.1",
    "PyYAML==6.0.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "coverage[toml]==7.17.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.4",
    "validate-pyproject[all]==0.27",
]

[tool.setuptools]
packages = ["indykite"]

[tool.coverage.run]
omit = [
    "test/*",
    "integration/*",
    "manual_testing/*",
    "tmp/*",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "ALL",
]

ignore = [
    "D", # docstrings: https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/ The formatter enforces consistent use of trailing commas, making the rule redundant.
    "PLC0415", # https://docs.astral.sh/ruff/rules/import-outside-top-level/
    "CPY001", # https://docs.astral.sh/ruff/rules/missing-copyright-notice/
]

[tool.ruff.lint.extend-per-file-ignores]

"test/**/*.py" = [
    # at least these should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "SLF", # Private member accessed
    "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
]

"integration/**/*.py" = [
    # at least these should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
]
